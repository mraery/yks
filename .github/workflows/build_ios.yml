name: Build iOS (YKS Patika)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA for Sideloading / Sideloadly
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ykspatika.ipa Payload
          mkdir -p output
          mv ykspatika.ipa output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ykspatika-ios-ipa
          path: output/ykspatika.ipa
          retention-days: 14
