<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/yks/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="YKS Patika">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>YKS Patika - TYT & AYT Hazırlık</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.yksAudio = {
      ctx: null,
      _init: function() {
        try {
          if (!this.ctx) {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {
          console.warn('Audio init error:', e);
        }
      },
      playCorrect: function() {
        try {
          this._init();
          if (!this.ctx) return;
          var ctx = this.ctx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;
          var notes = [523.25, 659.25, 783.99, 1046.50];
          for (var i = 0; i < notes.length; i++) {
            (function(idx, freq) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + idx * 0.07);
              gain.gain.setValueAtTime(0, now + idx * 0.07);
              gain.gain.linearRampToValueAtTime(0.24, now + idx * 0.07 + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.07);
              osc.stop(now + idx * 0.07 + 0.35);
            })(i, notes[i]);
          }
        } catch (e) {
          console.warn('Audio playCorrect error:', e);
        }
      },
      playIncorrect: function() {
        try {
          this._init();
          if (!this.ctx) return;
          var ctx = this.ctx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;

          // 🎵 Gamified, tatlı ve net duyulan iki tonlu ahşap marimba / Duolingo tınısı (440Hz -> 311Hz)
          var notes = [
            { freq: 440.0, time: 0.0, dur: 0.22, vol: 0.32 },
            { freq: 311.13, time: 0.11, dur: 0.32, vol: 0.34 }
          ];

          for (var i = 0; i < notes.length; i++) {
            (function(n) {
              var tStart = now + n.time;
              var tEnd = tStart + n.dur;

              // 1. Ana ahşap melodik tını (triangle wave + 1600Hz yumuşatıcı filtre)
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              var filter = ctx.createBiquadFilter();

              osc.type = 'triangle';
              osc.frequency.setValueAtTime(n.freq, tStart);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(1600, tStart);

              gain.gain.setValueAtTime(0, tStart);
              gain.gain.linearRampToValueAtTime(n.vol, tStart + 0.018);
              gain.gain.exponentialRampToValueAtTime(0.001, tEnd);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(ctx.destination);

              osc.start(tStart);
              osc.stop(tEnd);

              // 2. Tok ve dolgun alt gövde rezonansı (sine sub-oscillator)
              var subOsc = ctx.createOscillator();
              var subGain = ctx.createGain();
              subOsc.type = 'sine';
              subOsc.frequency.setValueAtTime(n.freq * 0.5, tStart);

              subGain.gain.setValueAtTime(0, tStart);
              subGain.gain.linearRampToValueAtTime(n.vol * 0.45, tStart + 0.02);
              subGain.gain.exponentialRampToValueAtTime(0.001, tEnd);

              subOsc.connect(subGain);
              subGain.connect(ctx.destination);

              subOsc.start(tStart);
              subOsc.stop(tEnd);
            })(notes[i]);
          }
        } catch (e) {
          console.warn('Audio playIncorrect error:', e);
        }
      },
      playLessonPass: function() {
        try {
          this._init();
          if (!this.ctx) return;
          var ctx = this.ctx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;
          // 🏆 "Dersi Geçtin!" - Coşkulu ve Neşeli Zafer Fanfarı
          var notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          for (var i = 0; i < notes.length; i++) {
            (function(idx, freq) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.09);
              gain.gain.setValueAtTime(0, now + idx * 0.09);
              gain.gain.linearRampToValueAtTime(0.28, now + idx * 0.09 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.55);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.09);
              osc.stop(now + idx * 0.09 + 0.55);
            })(i, notes[i]);
          }
        } catch (e) {
          console.warn('Audio playLessonPass error:', e);
        }
      },
      playLessonFail: function() {
        try {
          this._init();
          if (!this.ctx) return;
          var ctx = this.ctx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;
          // 💔 "Dersi Geçemedin!" - Sinir bozmayan, tatlı ve şefkatli teselli melodisi (G4 -> Eb4 -> C4)
          var notes = [
            { freq: 392.00, time: 0.0, dur: 0.32, vol: 0.28 },
            { freq: 311.13, time: 0.20, dur: 0.38, vol: 0.30 },
            { freq: 261.63, time: 0.42, dur: 0.55, vol: 0.32 }
          ];
          for (var i = 0; i < notes.length; i++) {
            (function(n) {
              var tStart = now + n.time;
              var tEnd = tStart + n.dur;

              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              var filter = ctx.createBiquadFilter();

              osc.type = 'triangle';
              osc.frequency.setValueAtTime(n.freq, tStart);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(1200, tStart);

              gain.gain.setValueAtTime(0, tStart);
              gain.gain.linearRampToValueAtTime(n.vol, tStart + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.001, tEnd);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(ctx.destination);

              osc.start(tStart);
              osc.stop(tEnd);
            })(notes[i]);
          }
        } catch (e) {
          console.warn('Audio playLessonFail error:', e);
        }
      },
      playComplete: function() {
        this.playLessonPass();
      },
      playFlip: function() {
        try {
          this._init();
          if (!this.ctx) return;
          var ctx = this.ctx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch (e) {}
      }
    };

    var unlockAudio = function() {
      if (window.yksAudio) {
        window.yksAudio._init();
        if (window.yksAudio.ctx && window.yksAudio.ctx.state === 'running') {
          window.removeEventListener('pointerdown', unlockAudio);
          window.removeEventListener('keydown', unlockAudio);
          window.removeEventListener('click', unlockAudio);
        }
      }
    };
    window.addEventListener('pointerdown', unlockAudio);
    window.addEventListener('keydown', unlockAudio);
    window.addEventListener('click', unlockAudio);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
